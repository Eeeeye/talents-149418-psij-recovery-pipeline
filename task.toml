schema_version = "1.1"

[task]
name = "talents/psij-recovery-pipeline"
description = "Repair PSI/J persistence, scheduler rendering, fork-safe local reaping, and race-safe recovered batch completion."
authors = []
keywords = ["hpc", "psij", "batch-scheduler", "persistence", "recovery"]

[metadata]
difficulty = "hard"
difficulty_explanation = "The repair crosses persistent JobSpec recovery, three scheduler dialects, asynchronous state ordering, launcher classification, process-local reapers after fork, weak-reference thread lifetime, in-flight same-ID attachment races, and delayed shared-filesystem completion evidence. Correctness requires coordinated multi-module concurrency and parsing changes plus exact timeout and file-format boundaries; the prior L1 strategy does not cover these independent failure chains."
category = "systems-engineering"

[verifier]
timeout_sec = 300.0
user = "root"

[agent]
timeout_sec = 1800.0
user = "agent"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
mcp_servers = []

[environment.healthcheck]
command = "python3 scripts/healthcheck.py"
interval_sec = 2.0
timeout_sec = 20.0
retries = 3

[verifier.env]

[solution.env]
